<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700&family=Sofia+Sans+Condensed:wght@600;700&display=swap">
<style>
  :root {
    color-scheme: light;   /* always white, also when the system is in dark mode */
    --paper: #ffffff; --ink: #18203a; --pencil: #5a6380; --faint: #8e96ae; --rule: #dde1ec; --tint: #f2f4f9;
    --live: #1f9d62; --warn: #b7791f;
    --sans: "Sofia Sans", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --cond: "Sofia Sans Condensed", "DIN Condensed", "Avenir Next Condensed", "Arial Narrow", sans-serif;
    --row: 36px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.45 var(--sans);
         font-variant-numeric: tabular-nums lining-nums; -webkit-font-smoothing: antialiased; }
  .page { max-width: 1480px; margin: 0 auto; padding: 30px 32px 44px; }

  /* headline: the state of the race as a sentence */
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px 40px; flex-wrap: wrap; }
  h1 { font: 700 clamp(30px, 3.7vw, 54px)/1.02 var(--cond); letter-spacing: -0.012em; margin: 0; text-wrap: balance; }
  .lede { margin: 8px 0 0; color: var(--pencil); font-size: 16.5px; max-width: 70ch; }
  .clock { text-align: right; flex: none; margin-left: auto; }
  .clock .label { color: var(--pencil); font-size: 14.5px; }
  .clock .time { font: 600 40px/1 var(--cond); margin-top: 2px; min-height: 40px; }
  .live { display: flex; gap: 7px; align-items: center; justify-content: flex-end; color: var(--pencil); font-size: 13.5px; margin-top: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.ok { background: var(--live); }
  .dot.warn { background: var(--warn); }

  .board { display: grid; grid-template-columns: minmax(0, 1fr) clamp(380px, 32vw, 430px); gap: 36px; align-items: start; margin-top: 26px; }

  /* chart column */
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px; min-height: 30px; }
  .views { display: inline-flex; gap: 18px; }
  .views button { border: 0; background: none; padding: 2px 0 4px; font: 500 16px/1.2 var(--sans); color: var(--pencil); cursor: pointer;
                  border-bottom: 2px solid transparent; }
  .views button[aria-pressed="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
  .check { display: inline-flex; align-items: center; gap: 6px; color: var(--pencil); font-size: 14px; cursor: pointer; }
  .check input { accent-color: var(--ink); margin: 0; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px 20px; justify-content: flex-end; margin-left: auto; }
  [hidden] { display: none !important; }
  .key { margin-top: 22px; }
  .key h2 { font: 700 18px/1.2 var(--cond); margin: 0 0 6px; }
  .key .k { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; column-gap: 10px; align-items: center;
            height: 26px; font-size: 14px; white-space: nowrap; border-bottom: 1px solid var(--rule); }
  .key .k span:last-child { color: var(--pencil); }
  .chip { width: 10px; height: 10px; border-radius: 2px; flex: none; display: inline-block; }
  #plot { margin-top: 6px; }
  #plot svg { display: block; touch-action: pan-y; outline-offset: 4px; }
  svg text { font-family: var(--sans); font-size: 12.5px; fill: var(--pencil); }
  svg text.flag { fill: var(--ink); font-weight: 700; font-size: 13px; }
  svg path.line, svg circle.end { transition: opacity .15s; }
  .note { color: var(--pencil); font-size: 13.5px; margin: 10px 0 0; max-width: 78ch; }

  /* standings: laid out like the line items of an invoice */
  .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; min-height: 30px; }
  .cap strong { font: 700 23px/1.1 var(--cond); }
  .cap span { color: var(--pencil); font-size: 14px; }
  .approach { display: flex; align-items: center; gap: 6px; color: var(--pencil); font-size: 14px; margin-top: 3px; }
  .approach b { color: var(--ink); font-weight: 600; }
  .cols, .entry { display: grid; grid-template-columns: 22px 22px minmax(0, 1fr) 60px 78px; column-gap: 8px; align-items: center; }
  .cols { color: var(--pencil); font-size: 12.5px; padding: 9px 0 6px; border-bottom: 3px double var(--ink); margin-top: 6px; }
  .cols .r, .entry .r { text-align: right; }
  .entries { position: relative;
             background: repeating-linear-gradient(to bottom, transparent 0 calc(var(--row) - 1px), var(--rule) calc(var(--row) - 1px) var(--row)); }
  .entry { position: absolute; left: 0; right: 0; top: 0; height: var(--row); padding: 0; border: 0; background: none; color: inherit;
           font: inherit; font-size: 14.5px; text-align: left; cursor: pointer; transition: transform .22s ease; }
  .entry:hover, .entry:focus-visible { background: var(--tint); }
  .entry .pos { color: var(--pencil); text-align: right; }
  .entry .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .delta { color: var(--pencil); font-size: 13.5px; }
  .entry.me .name, .entry.me .total, .entry.me .pos { font-weight: 700; color: var(--ink); }
  .entry[aria-pressed="false"] > * { opacity: .34; }
  .entry[aria-pressed="false"] .name { text-decoration: line-through; }
  .hint { color: var(--pencil); font-size: 13.5px; margin: 12px 0 0; }

  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (max-width: 1020px) { .board { grid-template-columns: minmax(0, 1fr); gap: 30px; } }
  @media (max-width: 700px) { .page { padding: 20px 16px 32px; } .clock { text-align: left; margin-left: 0; } .live { justify-content: flex-start; } }
  @media (prefers-reduced-motion: reduce) { .entry, svg path.line, svg circle.end { transition: none; } }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <h1 id="headline">Waiting for the leaderboard</h1>
      <p class="lede" id="lede">Connecting to the local server.</p>
    </div>
    <div class="clock" aria-live="off">
      <div class="label" id="clockLabel">&nbsp;</div>
      <div class="time" id="clockTime"></div>
      <div class="live"><span class="dot" id="dot"></span><span id="status">Connecting</span></div>
    </div>
  </header>

  <div class="board">
    <section aria-label="Chart">
      <div class="tools">
        <div class="views" role="group" aria-label="What the chart shows">
          <button id="vScore" type="button" aria-pressed="true">Score</button>
          <button id="vRank" type="button" aria-pressed="false">Rank</button>
        </div>
        <div class="opts">
          <label class="check" id="cutWrap"><input type="checkbox" id="cut" checked> Cut axis at −150k</label>
          <label class="check" id="marksWrap"><input type="checkbox" id="marks" checked> <span id="marksText">Markers</span></label>
          <label class="check" id="bandsWrap"><input type="checkbox" id="bands"> Approach colours</label>
        </div>
      </div>
      <div id="plot"><svg id="svg" role="img" tabindex="0" aria-label="Chart of all teams per round. Use the left and right arrow keys to step through the rounds."></svg></div>
      <p class="note" id="note"></p>
    </section>

    <section class="ledger" aria-label="Standings">
      <div class="cap"><strong id="capRound">Standings</strong><span id="capWhen"></span></div>
      <div class="approach" id="capPhase" hidden></div>
      <div class="cols"><span class="r">Pos.</span><span></span><span>Team</span><span class="r">This round</span><span class="r">Total</span></div>
      <div class="entries" id="entries"></div>
      <p class="hint">Move across the chart to see the standings after any round. Click a team to hide its line, double-click to show it alone.</p>
      <div class="key" id="phaseKey" hidden></div>
    </section>
  </div>
</div>
<script>
"use strict";
const POLL_MS = 20000, CUT = -150000, ROW = 36, NS = "http://www.w3.org/2000/svg";
// Colours follow the team, not its rank. A second use of a hue is always dashed.
const KNOWN = {
  "Kiebler Software Solutions": ["#e15759", 0], "chineseModels": ["#76b7b2", 0], "Humble Legends": ["#9c755f", 0],
  "FDN": ["#59a14f", 0], "TRINNERS4WINNERS": ["#f28e2b", 0], "GemischtesHack": ["#e3b926", 0], "CHOOMS": ["#f28e2b", 1],
  "404": ["#4e79a7", 0], "alpha": ["#b07aa1", 0], "Lumenauts": ["#e15759", 1], "Asgardians": ["#4e79a7", 1],
  "vietgang": ["#59a14f", 1],
};
const SPARE = [["#ff9da7", 0], ["#bab0ac", 0], ["#76b7b2", 1], ["#9c755f", 1], ["#b07aa1", 1], ["#e3b926", 1]];
const DASH = "6 4";
// Our own approaches, in order of first appearance: single agent, three ensemble stages in one hue, self-learning agent,
// multi-agent, and a grey for one more. Squares and bands carry these; lines carry the team colours.
const PHASE_COLORS = ["#8b94aa", "#b3bdf5", "#7484e6", "#3a47b0", "#d9a441", "#d6478f", "#c9cdd8"];

const $ = s => document.querySelector(s);
const nf = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
const fmt = v => { const r = Math.round(v); return r < 0 ? "−" + nf.format(-r) : nf.format(r); };
const signed = v => { const r = Math.round(v); return r > 0 ? "+" + nf.format(r) : r < 0 ? "−" + nf.format(-r) : "0"; };
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
const store = {
  get(k, d) { try { const v = localStorage.getItem("lb." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("lb." + k, JSON.stringify(v)); } catch { /* private window */ } },
};
const query = new URLSearchParams(location.search);
const flag = (k, d) => (query.has(k) ? query.get(k) !== "0" : store.get(k, d));
const state = { view: query.get("view") || store.get("view", "score"),
                cut: store.get("cut", true), marks: store.get("marks", true), bands: flag("bands", true),
                hidden: new Set(store.get("hidden", [])), hover: null, focus: null };
let raw = null, model = null, geo = null, lastOk = false;
const rows = new Map();   // team name -> standings row

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  for (const c of kids) e.append(c);
  return e;
}
function S(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}

function build(d) {
  const ids = d.game_ids, n = ids.length;
  const teams = d.teams.map(t => {
    let s = 0;
    const cells = ids.map((_, i) => t.cells[i] || 0);
    return { name: t.name, cells, cum: cells.map(v => (s += v)), rank: new Array(n) };
  });
  for (let i = 0; i < n; i++) {
    [...teams].sort((a, b) => b.cum[i] - a.cum[i] || a.name.localeCompare(b.name)).forEach((t, k) => (t.rank[i] = k + 1));
  }
  if (n) teams.sort((a, b) => a.rank[n - 1] - b.rank[n - 1]);
  const unknown = teams.map(t => t.name).filter(x => !KNOWN[x]).sort();
  for (const t of teams) {
    const [color, dashed] = KNOWN[t.name] || SPARE[unknown.indexOf(t.name) % SPARE.length];
    t.color = color; t.dashed = !!dashed; t.me = t.name === d.team;
  }
  const empty = ids.filter((_, i) => teams.every(t => t.cells[i] === 0));
  const start = {};
  for (const g of d.games || []) start[g.id] = g.start_time;
  const names = [...new Set((d.phases || []).map(p => p.name))];
  const phases = (d.phases || []).map(p => ({ ...p, color: PHASE_COLORS[names.indexOf(p.name) % PHASE_COLORS.length],
                                              range: p.from === p.to ? String(p.from) : `${p.from}–${p.to}` }));
  return { ids, n, teams, empty, start, phases, planned: (d.games || []).length, marks: d.marks || [], markLabel: d.mark_label || "Marker" };
}

function niceStep(span, target) {
  const rawStep = span / target, p = Math.pow(10, Math.floor(Math.log10(rawStep))), f = rawStep / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}
function axisLabel(v, step) {
  if (v === 0) return "0";
  const sign = v < 0 ? "−" : "", a = Math.abs(v);
  if (step >= 1e6 || (a >= 2e6 && step >= 1e5)) return sign + (a / 1e6).toFixed(step >= 1e6 ? 0 : 1) + "M";
  return sign + (step >= 1000 ? a / 1000 + "k" : nf.format(a));
}
function swatch(t) {
  const s = S("svg", { width: 22, height: 10, viewBox: "0 0 22 10", "aria-hidden": "true" });
  s.append(S("line", { x1: 1, x2: 21, y1: 5, y2: 5, stroke: t.color, "stroke-width": t.me ? 4 : 2.5,
                       "stroke-linecap": "round", "stroke-dasharray": t.dashed ? "5 3" : "" }));
  return s;
}

function headline() {
  const m = model, last = m.n - 1;
  if (!m.n) {
    $("#headline").textContent = "No round has finished yet";
    $("#lede").textContent = "The chart fills in as soon as the first round is scored.";
    document.title = "Live leaderboard";
    return;
  }
  const [first, second] = m.teams, me = m.teams.find(t => t.me);
  const gap = second ? first.cum[last] - second.cum[last] : 0;
  $("#headline").textContent = !second ? `${first.name} leads` : Math.round(gap) === 0
    ? `${first.name} and ${second.name} are level` : `${first.name} leads by ${fmt(gap)}`;
  const parts = [`After round ${m.ids[last]}` + (m.planned ? ` of ${m.planned}.` : ".")];
  if (me && me !== first) parts.push(`${me.name} is ${ordinal(me.rank[last])}, ${fmt(first.cum[last] - me.cum[last])} behind.`);
  else if (second) parts.push(`${second.name} is second with ${fmt(second.cum[last])}.`);
  $("#lede").textContent = parts.join(" ");
  document.title = `Round ${m.ids[last]}: ${first.name} leads`;
}

function buildRows() {
  const m = model, box = $("#entries");
  if (rows.size === m.teams.length && m.teams.every(t => rows.has(t.name))) return;
  rows.clear();
  box.replaceChildren(...m.teams.map(t => {
    const r = { pos: el("span", { class: "pos" }), name: el("span", { class: "name", title: t.name }, t.name),
                delta: el("span", { class: "delta r" }), total: el("span", { class: "total r" }) };
    r.el = el("button", { type: "button", class: t.me ? "entry me" : "entry" }, r.pos, swatch(t), r.name, r.delta, r.total);
    r.el.addEventListener("click", () => { state.hidden.has(t.name) ? state.hidden.delete(t.name) : state.hidden.add(t.name); saveHidden(); });
    r.el.addEventListener("dblclick", () => {
      const only = model.teams.every(o => o.name === t.name || state.hidden.has(o.name));
      state.hidden = new Set(only ? [] : model.teams.filter(o => o.name !== t.name).map(o => o.name)); saveHidden();
    });
    for (const ev of ["pointerenter", "focus"]) r.el.addEventListener(ev, () => { state.focus = t.name; applyFocus(); });
    for (const ev of ["pointerleave", "blur"]) r.el.addEventListener(ev, () => { state.focus = null; applyFocus(); });
    rows.set(t.name, r);
    return r.el;
  }));
  box.style.height = m.teams.length * ROW + "px";
}

// The standings after round index i. Rows keep their element and slide to their place.
function ledger(i) {
  const m = model;
  if (!m.n) { $("#capRound").textContent = "Standings"; $("#capWhen").textContent = ""; return; }
  $("#capRound").textContent = `After round ${m.ids[i]}`;
  const at = m.start[m.ids[i]];
  $("#capWhen").textContent = at ? "started " + new Date(at).toLocaleString("en-GB", { weekday: "short", hour: "2-digit", minute: "2-digit" }) : "";
  const ph = state.bands && m.phases.find(p => p.from <= m.ids[i] && m.ids[i] <= p.to), cp = $("#capPhase");
  cp.hidden = !ph;
  if (ph) {
    const c = el("span", { class: "chip" }); c.style.background = ph.color;
    cp.replaceChildren(c, "Our approach:", el("b", {}, ph.name));
    cp.title = ph.note || "";
  }
  for (const t of m.teams) {
    const r = rows.get(t.name), shown = !state.hidden.has(t.name);
    r.el.style.transform = `translateY(${(t.rank[i] - 1) * ROW}px)`;
    r.el.setAttribute("aria-pressed", String(shown));
    r.el.setAttribute("aria-label", `Position ${t.rank[i]}, ${t.name}, total ${fmt(t.cum[i])}, this round ${signed(t.cells[i])}. ${shown ? "Shown" : "Hidden"} in the chart.`);
    r.pos.textContent = t.rank[i];
    r.delta.textContent = signed(t.cells[i]);
    r.total.textContent = fmt(t.cum[i]);
  }
}

function render() {
  const m = model;
  if (!m) return;
  const rankView = state.view === "rank", last = m.n - 1;
  $("#vScore").setAttribute("aria-pressed", String(!rankView));
  $("#vRank").setAttribute("aria-pressed", String(rankView));
  $("#cutWrap").style.display = rankView ? "none" : "";
  $("#marksWrap").style.display = m.marks.length ? "" : "none";
  $("#marksText").textContent = `“${m.markLabel}” markers`;
  $("#bandsWrap").style.display = m.phases.length ? "" : "none";
  $("#cut").checked = state.cut; $("#marks").checked = state.marks;
  $("#bands").checked = state.bands;
  const phases = m.n ? m.phases.filter(p => p.to >= m.ids[0] && p.from <= m.ids[last]) : [];
  const key = $("#phaseKey");
  key.hidden = !(state.bands && phases.length);
  if (!key.hidden) {
    const byName = new Map();
    for (const p of phases) byName.set(p.name, [...(byName.get(p.name) || []), p]);
    key.replaceChildren(el("h2", {}, "Our approach in each round"), ...[...byName].map(([name, ps]) => {
      const c = el("span", { class: "chip" }); c.style.background = ps[0].color;
      return el("div", { class: "k", title: ps.map(p => `${p.range}: ${p.note}`).join("\n") }, c, el("span", {}, name),
                el("span", {}, (ps.length > 1 || ps[0].from !== ps[0].to ? "rounds " : "round ") + ps.map(p => p.range).join(", ")));
    }));
  }
  headline();
  buildRows();

  const svg = $("#svg"), wrap = $("#plot");
  svg.replaceChildren();
  geo = null;
  if (!m.n) { svg.setAttribute("height", 0); $("#note").textContent = ""; ledger(0); return; }

  const W = Math.max(320, wrap.clientWidth);
  const H = Math.round(Math.max(400, Math.min(760, window.innerHeight - 290, W * 0.8)));
  const M = { l: rankView ? 30 : 52, r: rankView ? 30 : 12, t: 30, b: 44 };
  const iw = W - M.l - M.r, ih = H - M.t - M.b;
  const X = i => M.l + (m.n > 1 ? (i / (m.n - 1)) * iw : iw / 2);
  const vis = m.teams.filter(t => !state.hidden.has(t.name));
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);

  // markers between rounds
  const gMarks = S("g");
  let prevLabel = -Infinity;
  if (state.marks) for (const r of m.marks) {
    const i = r - m.ids[0];
    if (i < 0 || i > last + 0.5) continue;
    const x = Math.min(X(i), M.l + iw);
    gMarks.append(S("line", { x1: x, x2: x, y1: M.t, y2: M.t + ih, stroke: "var(--pencil)", "stroke-width": 1.25, "stroke-dasharray": "5 5" }));
    if (x - prevLabel < m.markLabel.length * 7.5 + 14) continue;   // no room next to the previous label
    gMarks.append(S("text", { x: x - 7, y: M.t + 14, "text-anchor": "end" }, m.markLabel));
    prevLabel = x;
  }

  // our approach per round: a colour strip along the top and a faint band behind the lines
  const gBands = S("g");
  const edge = r => Math.max(M.l, Math.min(M.l + iw, X(r - m.ids[0])));
  if (state.bands) for (const p of phases) {
    const x0 = edge(p.from - 0.5), x1 = edge(p.to + 0.5);
    gBands.append(S("rect", { x: x0, y: M.t, width: x1 - x0, height: ih, fill: p.color, opacity: 0.1 }));
    const seg = S("rect", { x: x0 + (x0 > M.l ? 0.75 : 0), y: M.t - 7, width: Math.max(1, x1 - x0 - (x0 > M.l ? 1.5 : 0.75)), height: 5, fill: p.color });
    seg.append(S("title", {}, `Rounds ${p.range}: ${p.name}. ${p.note || ""}`));
    gBands.append(seg);
  }
  let Y, below = [];
  const gGrid = S("g"), gAxis = S("g");
  if (rankView) {
    const T = m.teams.length;
    Y = r => M.t + 34 + (T > 1 ? ((r - 1) / (T - 1)) * (ih - 46) : 0);   // room for the marker labels above rank 1
    for (let r = 1; r <= T; r++) {
      gGrid.append(S("line", { x1: M.l, x2: M.l + iw, y1: Y(r), y2: Y(r), stroke: "var(--rule)" }));
      gAxis.append(S("text", { x: M.l - 12, y: Y(r) + 4, "text-anchor": "end" }, String(r)));
      gAxis.append(S("text", { x: M.l + iw + 12, y: Y(r) + 4 }, String(r)));
    }
  } else {
    let vmax = 0, vmin = 0;
    for (const t of vis) for (const v of t.cum) { if (v > vmax) vmax = v; if (v < vmin) vmin = v; }
    const cutOn = state.cut && vmin < CUT;
    const step = niceStep(Math.max(vmax - (cutOn ? CUT : vmin), 1), 6);
    const hi = Math.max(Math.ceil(vmax / step) * step, step), lo = cutOn ? CUT : Math.floor(vmin / step) * step;
    Y = v => M.t + ((hi - v) / (hi - lo)) * ih;
    const ticks = [];
    for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-6; v += step) ticks.push(Math.round(v));
    if (cutOn && ticks[0] - lo > step * 0.3) ticks.unshift(lo); else if (cutOn) ticks[0] = lo;
    for (const v of ticks) {
      gGrid.append(S("line", { x1: M.l, x2: M.l + iw, y1: Y(v), y2: Y(v), stroke: v === 0 ? "var(--ink)" : "var(--rule)" }));
      gAxis.append(S("text", { x: M.l - 9, y: Y(v) + 4, "text-anchor": "end" }, axisLabel(v, step)));
    }
    if (cutOn) below = [...vis].filter(t => t.cum[last] < CUT).sort((a, b) => a.cum[last] - b.cum[last]);
  }

  // x axis
  const stepX = [1, 2, 3, 5, 10, 20, 50].find(s => (iw / Math.max(m.n - 1, 1)) * s >= 26) || 50;
  for (let i = 0; i < m.n; i += stepX) {
    gAxis.append(S("line", { x1: X(i), x2: X(i), y1: M.t + ih, y2: M.t + ih + 5, stroke: "var(--faint)" }));
    gAxis.append(S("text", { x: X(i), y: M.t + ih + 20, "text-anchor": "middle" }, String(m.ids[i])));
  }
  if (rankView) gAxis.append(S("line", { x1: M.l, x2: M.l + iw, y1: M.t + ih, y2: M.t + ih, stroke: "var(--faint)" }));
  gAxis.append(S("text", { x: M.l + iw / 2, y: H - 5, "text-anchor": "middle" }, "Round"));

  // lines, own team on top
  const defs = S("defs"), clip = S("clipPath", { id: "clip" });
  clip.append(S("rect", { x: M.l - 3, y: M.t - 4, width: iw + 12, height: ih + 4 }));
  defs.append(clip);
  const gLines = S("g", { "clip-path": "url(#clip)", "stroke-linejoin": "round", "stroke-linecap": "round" });
  const series = t => (rankView ? t.rank : t.cum);
  for (const t of [...vis].sort((a, b) => a.me - b.me)) {
    const vals = series(t);
    if (m.n > 1) gLines.append(S("path", { class: "line", "data-team": t.name, fill: "none", stroke: t.color, "stroke-width": t.me ? 3.5 : 1.75,
      "stroke-dasharray": t.dashed ? DASH : "", d: "M" + vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("L") }));
    gLines.append(S("circle", { class: "end", "data-team": t.name, cx: X(last), cy: Y(vals[last]), r: t.me ? 5 : 3.25, fill: t.color }));
  }

  const gHover = S("g", { id: "hover", "pointer-events": "none" });
  const hit = S("rect", { x: M.l - 8, y: M.t, width: iw + 16, height: ih, fill: "transparent" });
  svg.append(defs, gBands, gGrid, gMarks, gLines, gAxis, gHover, hit);
  geo = { X, Y, M, iw, ih, W, vis, series };
  hit.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
    showRound(m.n > 1 ? Math.round(((px - M.l) / iw) * (m.n - 1)) : 0);
  });
  hit.addEventListener("pointerleave", clearRound);
  applyFocus();
  if (state.hover !== null) showRound(state.hover); else ledger(last);

  const notes = [];
  if (state.marks && m.marks.length) notes.push(`Dashed lines mark “${m.markLabel}”: ` + m.marks.map(r =>
    Number.isInteger(r) ? `at round ${r}` : `between rounds ${Math.floor(r)} and ${Math.ceil(r)}`).join(", ") + ".");
  if (below.length) notes.push(`The axis is cut at ${fmt(CUT)}, so the lines of ${below.map(t => t.name).join(", ")} run off the bottom.`);
  if (m.empty.length) notes.push(`Round${m.empty.length > 1 ? "s" : ""} ${m.empty.join(" and ")} had no transactions.`);
  $("#note").textContent = notes.join(" ");
}

function showRound(i) {
  const m = model, g = geo, gHover = $("#hover");
  if (!g || !gHover) return;
  i = Math.max(0, Math.min(m.n - 1, i));
  state.hover = i;
  const x = g.X(i), yMax = g.M.t + g.ih;
  gHover.replaceChildren(S("line", { x1: x, x2: x, y1: g.M.t - 6, y2: yMax, stroke: "var(--ink)", "stroke-width": 1 }));
  for (const t of g.vis) {
    const y = g.Y(g.series(t)[i]);
    if (y <= yMax + 1) gHover.append(S("circle", { cx: x, cy: y, r: t.me ? 5.5 : 4.5, fill: t.color, stroke: "var(--paper)", "stroke-width": 2 }));
  }
  const label = `Round ${m.ids[i]}`, half = label.length * 3.6 + 2;
  gHover.append(S("text", { class: "flag", x: Math.max(g.M.l + half, Math.min(g.M.l + g.iw - half, x)), y: g.M.t - 11, "text-anchor": "middle" }, label));
  ledger(i);
}
function clearRound() {
  state.hover = null;
  const h = $("#hover"); if (h) h.replaceChildren();
  if (model && model.n) ledger(model.n - 1);
}
function applyFocus() {
  const f = state.focus && !state.hidden.has(state.focus) ? state.focus : null;
  for (const e of document.querySelectorAll("#svg [data-team]")) e.style.opacity = !f || e.dataset.team === f ? 1 : 0.16;
}
function saveHidden() { store.set("hidden", [...state.hidden]); render(); }

function tick() {
  const dot = $("#dot");
  if (!raw) { dot.className = "dot warn"; return; }
  const live = lastOk && !raw.error, at = raw.fetched_at ? new Date(raw.fetched_at * 1000).toLocaleTimeString("en-GB") : null;
  dot.className = "dot " + (live ? "ok" : "warn");
  $("#status").textContent = live ? `Live, updated ${at}`
    : lastOk ? `Leaderboard unreachable${at ? `, showing data from ${at}` : ""}`
    : `Local server stopped${at ? `, showing data from ${at}` : ""}. Restart lb_chart.py`;
  const games = raw.games || [];
  const open = games.filter(g => g.status !== "completed").sort((a, b) => a.start_time.localeCompare(b.start_time))[0];
  if (open) {
    const s = Math.round((Date.parse(open.start_time) - Date.now()) / 1000);
    $("#clockLabel").textContent = s > 0 ? `Round ${open.id} starts in` : `Round ${open.id} is being played`;
    $("#clockTime").textContent = s > 0 ? (s >= 3600 ? `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, "0")}` : Math.floor(s / 60))
      + ":" + String(s % 60).padStart(2, "0") : "now";
  } else {
    $("#clockLabel").textContent = games.length ? `All ${games.length} rounds are played` : " ";
    $("#clockTime").textContent = games.length ? "Final" : "";
  }
}

async function poll() {
  try {
    const r = await fetch("/api/data", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    lastOk = true;
    const key = x => JSON.stringify([x.game_ids, x.teams, x.team, x.marks, x.phases, (x.games || []).length]);
    const changed = !raw || key(raw) !== key(d);
    raw = d;
    if (changed && d.teams.length) { model = build(d); render(); }
    else if (!model) $("#lede").textContent = d.error ? "The leaderboard did not answer. Trying again every 20 seconds." : "The leaderboard has no teams yet.";
  } catch (e) {
    lastOk = false;
    if (!raw) $("#lede").textContent = "Start the local server with: python3 -I research/live/lb_chart.py --open";
  }
  tick();
}

$("#vScore").addEventListener("click", () => { state.view = "score"; store.set("view", "score"); render(); });
$("#vRank").addEventListener("click", () => { state.view = "rank"; store.set("view", "rank"); render(); });
$("#cut").addEventListener("change", e => { state.cut = e.target.checked; store.set("cut", state.cut); render(); });
$("#marks").addEventListener("change", e => { state.marks = e.target.checked; store.set("marks", state.marks); render(); });
$("#bands").addEventListener("change", e => { state.bands = e.target.checked; store.set("bands", state.bands); render(); });
$("#svg").addEventListener("keydown", e => {
  if (!model || !model.n) return;
  const cur = state.hover === null ? model.n - 1 : state.hover;
  if (e.key === "ArrowLeft") showRound(cur - 1);
  else if (e.key === "ArrowRight") showRound(cur + 1);
  else if (e.key === "Home") showRound(0);
  else if (e.key === "End" || e.key === "Escape") clearRound();
  else return;
  e.preventDefault();
});
$("#svg").addEventListener("blur", clearRound);
new ResizeObserver(() => render()).observe($("#plot"));
window.addEventListener("resize", () => render());
poll();
setInterval(poll, POLL_MS);
setInterval(tick, 1000);
</script>
</body>
</html>
